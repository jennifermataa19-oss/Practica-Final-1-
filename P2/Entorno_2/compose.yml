services:
  py311:
    build:
      context: ..
      dockerfile: Entorno_2/Dockerfile
    container_name: tc_p1_py311
    volumes:
      - ..:/app
    ports:
      - "8550:8550"
    environment:
      - FLET_FORCE_WEB_SERVER=true
      - FLET_SERVER_PORT=8550
      - FLET_SERVER_IP=0.0.0.0
    command: python src/interfaz_2.py